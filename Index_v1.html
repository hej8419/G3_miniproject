<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wonder Worlds · 나의 단어 여행</title>

    <style>
        :root {
            --ink: #18324b;
            --accent: #176ca4;
            --pale: #e8f5ff;
            --line: #d5e5ef;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: #e8f5ff;
            font: 16px/1.6 system-ui, "Malgun Gothic", sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            min-height: 48px;
            padding: 12px 20px;
            border: 0;
            border-radius: 14px;
            background: #edf2f7;
            color: var(--ink);
            font-weight: 750;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(0.96);
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid #e78a17;
            outline-offset: 4px;
        }

        button.primary {
            background: var(--accent);
            color: white;
        }

        button.outline {
            border: 1px solid var(--line);
            background: white;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 1100px;
            margin: auto;
            padding: 26px 24px 16px;
        }

        h1 {
            margin: 0;
            font-size: 25px;
            letter-spacing: -1px;
        }

        h1 small {
            display: block;
            color: var(--accent);
            font-size: 13px;
            letter-spacing: 2px;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 0 24px 40px;
        }

        .layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 22px;
        }

        .passport,
        .surface {
            padding: 25px;
            border: 1px solid white;
            border-radius: 25px;
            background: #ffffffed;
            box-shadow: 0 10px 36px #2547610d;
        }

        .passport {
            align-self: start;
        }

        .passport h2 {
            margin: 0;
            font-size: 19px;
        }

        .meta {
            color: #526b80;
            font-size: 14px;
        }

        .route {
            display: grid;
            gap: 13px;
            margin: 22px 0;
        }

        .routeItem {
            padding: 14px;
            border: 1px dashed #c0cfdb;
            border-radius: 15px;
        }

        .routeItem.current {
            border: 2px solid var(--accent);
            background: var(--pale);
        }

        .routeItem strong {
            display: block;
        }

        .stamp {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 10px;
            border: 2px solid #b24f53;
            border-radius: 8px;
            color: #a33d43;
            font-size: 13px;
            font-weight: 900;
            transform: rotate(-7deg);
        }

        .stages {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .step {
            padding: 7px 10px;
            border-radius: 20px;
            background: #edf2f6;
            font-size: 13px;
        }

        .step.active {
            background: var(--accent);
            color: white;
        }

        .scene {
            height: 120px;
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: 18px;
            background: var(--pale);
        }

        .scene svg {
            width: 100%;
            height: 100%;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .between {
            justify-content: space-between;
        }

        .progress {
            height: 7px;
            margin: 12px 0 25px;
            overflow: hidden;
            border-radius: 10px;
            background: #e3ebf1;
        }

        .progress div {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
        }

        #content {
            min-height: 320px;
        }

        .flash {
            padding: 25px;
            border-radius: 22px;
            background: var(--pale);
            text-align: center;
        }

        .picture {
            font-size: 72px;
            line-height: 1.3;
        }

        .word {
            margin: 9px 0;
            font-size: 38px;
            font-weight: 850;
        }

        .meaning {
            font-size: 23px;
            font-weight: 700;
        }

        .example {
            margin: 16px 0 2px;
            font-size: 18px;
        }

        .translation {
            margin: 0;
            color: #526b80;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 22px 0;
        }

        .choice {
            border: 2px solid var(--line);
            background: white;
            text-align: left;
        }

        .choice.good {
            border-color: #27825c;
            background: #e8f8ef;
        }

        .choice.bad {
            border-color: #c06161;
            background: #fff0f0;
        }

        .feedback {
            margin: 18px 0;
            padding: 14px 18px;
            border-radius: 13px;
            background: #fff4d4;
            line-height: 1.7;
            white-space: pre-line;
        }

        .feedback.success {
            background: #e5f6ec;
            color: #1b6543;
        }

        .entry {
            width: 100%;
            min-width: 0;
            padding: 15px;
            border: 2px solid #bbcfdd;
            border-radius: 13px;
            font-size: 21px;
        }

        .passage {
            padding: 20px;
            border-radius: 18px;
            background: var(--pale);
            font-size: 19px;
            line-height: 2.5;
        }

        .passage .entry {
            display: inline-block;
            width: 155px;
            padding: 5px 10px;
            font-size: 17px;
            vertical-align: middle;
        }

        .passage .entry.good {
            border-color: #27825c;
        }

        .passage .entry.bad {
            border-color: #c06161;
        }

        .bank {
            padding: 12px;
            color: #526b80;
            font-size: 15px;
        }

        .hidden {
            display: none !important;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #12304bb8;
        }

        .modal {
            width: 100%;
            max-width: 480px;
            padding: 36px;
            border-radius: 28px;
            background: white;
            text-align: center;
        }

        .bigstamp {
            display: inline-block;
            margin: 12px;
            padding: 28px 12px;
            border: 5px double #b24f53;
            border-radius: 50%;
            color: #a33d43;
            font-size: 25px;
            animation: stamp 0.6s ease-out;
        }

        @keyframes stamp {
            0% {
                transform: scale(2.4) rotate(-25deg);
                opacity: 0;
            }

            70% {
                transform: scale(0.9) rotate(-8deg);
            }

            100% {
                transform: scale(1) rotate(-8deg);
            }
        }

        footer {
            padding: 20px;
            color: #526b80;
            text-align: center;
            font-size: 13px;
        }

        .reviewbox {
            padding-top: 15px;
            border-top: 1px solid var(--line);
        }

        .reviewbox button {
            width: 100%;
            margin-top: 8px;
            font-size: 14px;
        }

        .heroicon {
            font-size: 60px;
        }

        .done {
            padding: 25px 0;
            text-align: center;
        }

        @media (max-width: 760px) {
            header {
                padding: 18px;
            }

            main {
                padding: 0 14px 30px;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .passport {
                padding: 18px;
            }

            .route {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
                margin: 12px 0;
            }

            .routeItem {
                padding: 10px;
                font-size: 12px;
            }

            .routeItem strong {
                font-size: 13px;
            }

            .passport .meta {
                margin: 5px 0;
            }

            .surface {
                padding: 20px;
            }

            .scene {
                height: 95px;
            }

            .reviewbox {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }

            .reviewbox button {
                width: auto;
            }

            .choices {
                grid-template-columns: 1fr;
            }

            .word {
                font-size: 32px;
            }

            h1 {
                font-size: 21px;
            }

            .passage {
                padding: 15px;
                font-size: 17px;
            }

            .stamp {
                padding: 2px 5px;
                font-size: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>
            <small>WONDER WORLDS</small>
            나의 단어 여행 ✈️
        </h1>

        <button id="reset" class="outline">처음부터</button>
    </header>

    <main>
        <div class="layout">
            <aside class="passport">
                <h2>📘 MY PASSPORT</h2>
                <p class="meta">20개 단어 · 3개의 여행 장소</p>

                <div id="route" class="route"></div>

                <p id="saved" class="meta">
                    이 기기에 학습 진행을 저장해요.
                </p>

                <div class="reviewbox">
                    <strong>🎫 Return Trip</strong>

                    <p class="meta">
                        완료한 장소를 하루 뒤 다시 떠나보세요.
                    </p>

                    <div id="reviews"></div>
                </div>
            </aside>

            <section class="surface">
                <div id="scene" class="scene" aria-hidden="true"></div>

                <div id="stages" class="stages"></div>

                <div class="row between">
                    <span id="place" class="meta"></span>
                    <span id="counter" class="meta"></span>
                </div>

                <div class="progress">
                    <div id="bar"></div>
                </div>

                <div id="content"></div>

                <div
                    id="feedback"
                    role="status"
                    aria-live="polite"
                ></div>

                <div id="controls" class="controls"></div>
            </section>
        </div>
    </main>

    <footer>
        뜻을 알아보고, 직접 쓰고, 여행 이야기 속에서 사용해 보세요.
    </footer>

    <div
        id="overlay"
        class="overlay hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    ></div>

    <script>
        "use strict";

        // 단어 데이터
        const WORDS = [
            [

                "We arrive at the airport early.",

            ],
            [
                "airline",
                "항공사",
                "✈️",
                "Which airline do you use?",
                "어느 항공사를 이용하나요?"
            ],
            [
                "flight",
                "항공편; 비행",
                "🛩️",
                "Our flight leaves at nine.",

            ],
            [

            ],
            [
                "adventure",
                "모험",
                "🧭",
                "This trip is a new adventure.",
                "이번 여행은 새로운 모험이에요."
            ],
            [
                "foreign",
                "외국의",
                "🌏",
                "I want to visit a foreign country.",
                "나는 외국을 방문하고 싶어요."
            ],
            [
                "pack",
                "짐을 싸다",
                "🎒",
                "I pack my bag before the trip.",
                "나는 여행 전에 가방을 싸요."
            ],
            [
                "hotel",
                "호텔",
                "🏨",
                "We stay at a hotel near the beach.",
                "우리는 해변 근처 호텔에 머물러요."
            ],
            [
                "reserve",
                "예약하다",
                "📅",
                "I want to reserve a room.",
                "나는 방을 예약하고 싶어요."
            ],
            [
                "guest",
                "손님; 투숙객",
                "🛎️",
                "Each guest gets a room key.",
                "각 투숙객은 객실 열쇠를 받아요."
            ],
            [
                "view",
                "전망; 경치",
                "🌅",
                "The room has a beautiful view.",
                "그 방은 전망이 아름다워요."
            ],
            [
                "menu",
                "메뉴; 차림표",
                "📋",
                "Can I see the menu?",
                "메뉴를 볼 수 있을까요?"
            ],
            [
                "order",
                "주문하다",
                "🙋",
                "I want to order some food.",
                "나는 음식을 주문하고 싶어요."
            ],
            [
                "dish",
                "요리",
                "🍲",
                "This dish is very popular.",
                "이 요리는 아주 인기가 많아요."
            ],
            [
                "sauce",
                "소스",
                "🥣",
                "The sauce tastes sweet.",
                "그 소스는 달콤해요."
            ],
            [
                "pork",
                "돼지고기",
                "🐖",
                "This dish is made with pork.",
                "이 요리는 돼지고기로 만들어요."
            ],
            [
                "meal",
                "식사",
                "🍱",
                "We enjoy a delicious meal.",
                "우리는 맛있는 식사를 즐겨요."
            ],
            [
                "supper",
                "저녁 식사",
                "🌙🍽️",
                "We have supper at seven.",
                "우리는 7시에 저녁 식사를 해요."
            ],
            [
                "tip",
                "팁; 봉사료로 주는 돈",
                "🪙",
                "We leave a tip for the server.",
                "우리는 종업원에게 팁을 남겨요."
            ]
        ].map(function(item, index) {
            return {
                id: index,
                word: item[0],
                meaning: item[1],
                picture: item[2],
                example: item[3],
                translation: item[4]
            };
        });

        // 장소와 지문 데이터
        const SCENES = [
            {
                name: "Airport & Journey",
                ko: "공항과 여정",
                icon: "✈️",
                start: 0,
                end: 8,
                color: "#176ca4",
                pale: "#e8f5ff",
                story:
                    "Our {journey} begins today. " +
                    "I {pack} my bag and go to the {airport}. " +
                    "Our {airline} has a morning {flight}. " +
                    "We are going to a {foreign} country. " +
                    "We plan a city {tour}. " +
                    "What an exciting {adventure}!",
                korean:
                    "여정이 시작돼요. 짐을 싸서 공항에 가고, " +
                    "외국으로 떠나는 항공편에 올라 관광과 모험을 계획해요."
            },
            {
                name: "Hotel",
                ko: "호텔",
                icon: "🏨",
                start: 8,
                end: 12,
                color: "#7350a2",
                pale: "#f2edfb",
                story:
                    "After our {flight}, we arrive at the {hotel}. " +
                    "I want to {reserve} a room for my next visit. " +
                    "Each {guest} receives a key. " +
                    "Our room has a lovely {view} of the sea.",
                korean:
                    "비행 후 호텔에 도착했어요. 다음 방문을 위해 " +
                    "방을 예약하고 싶어요. 투숙객은 열쇠를 받고 " +
                    "바다 전망을 즐겨요."
            },
            {
                name: "Restaurant",
                ko: "식당",
                icon: "🍽️",
                start: 12,
                end: 20,
                color: "#b45125",
                pale: "#fff0e3",
                story:
                    "We leave the {hotel} and visit a restaurant for {supper}. " +
                    "The server brings a {menu}. " +
                    "We {order} a popular {dish} made with {pork}. " +
                    "It comes with a sweet {sauce}. " +
                    "We enjoy our {meal} and leave a {tip}.",
                korean:
                    "호텔에서 나와 저녁 식사를 해요. 메뉴를 보고 " +
                    "돼지고기 요리를 주문해요. 달콤한 소스와 함께 " +
                    "식사를 즐긴 후 팁을 남겨요."
            }
        ];

        const DAY = 24 * 60 * 60 * 1000;
        const KEY = "wonder-worlds-travel-v1";

        let storageOK = true;

        let state = {
            scene: 0,
            stage: 0,
            stamps: {},
            due: {}
        };

        // 저장된 학습 단계 불러오기
        try {
            const savedState = JSON.parse(localStorage.getItem(KEY));

            if (
                savedState &&
                Number.isInteger(savedState.scene) &&
                savedState.scene >= 0 &&
                savedState.scene <= 3 &&
                Number.isInteger(savedState.stage) &&
                savedState.stage >= 0 &&
                savedState.stage <= 3 &&
                savedState.stamps &&
                savedState.due
            ) {
                state = savedState;
            }
        } catch {
            storageOK = false;
        }

        let index = 0;
        let queue = [];
        let attempt = 0;
        let resolved = false;
        let reviewScene = null;
        let reviewMode = false;

        const $ = function(id) {
            return document.getElementById(id);
        };

        function shuffle(items) {
            const result = items.slice();

            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }

            return result;
        }

        function normalize(value) {
            return value.trim().toLowerCase();
        }

        function save() {
            try {
                localStorage.setItem(KEY, JSON.stringify(state));
            } catch {
                storageOK = false;
            }
        }

        function activeScene() {
            return reviewMode
                ? reviewScene
                : Math.min(state.scene, 2);
        }

        function currentStage() {
            return reviewMode ? 4 : state.stage;
        }

        function sceneWords(sceneNumber) {
            return WORDS.slice(
                SCENES[sceneNumber].start,
                SCENES[sceneNumber].end
            );
        }

        function cumulativeWords(sceneNumber) {
            return WORDS.slice(0, SCENES[sceneNumber].end);
        }

        function createButton(label, action, primary = false) {
            const button = document.createElement("button");

            button.type = "button";
            button.textContent = label;
            button.className = primary ? "primary" : "outline";
            button.onclick = action;

            return button;
        }

        function showFeedback(message, good = false) {
            $("feedback").className =
                "feedback" + (good ? " success" : "");

            $("feedback").textContent = message;
        }

        function clearFeedback() {
            $("feedback").className = "";
            $("feedback").textContent = "";
        }

        // 외부 이미지 없이 표시되는 장소 배경
        function sceneArt(sceneNumber) {
            const opening = `
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 700 120"

                >
            `;

            const pictures = [
                `

                    <path
                        d="M0 95H700"

                    <text x="70" y="64" font-size="38">☁️</text>
                    <text x="230" y="64" font-size="38">☁️</text>
                    <text x="390" y="64" font-size="38">☀️</text>
                `,
                `
                    <rect width="700" height="120" fill="#ede7f7"/>

                    <rect
                        x="32" y="20"
                        width="165" height="78"
                        rx="9" fill="#d7c9eb"
                    />

                    <path
                        d="M115 20V98M32 59H197"
                        stroke="#fff"
                        stroke-width="5"
                    />

                    <rect
                        x="275" y="70"
                        width="340" height="50"
                        rx="10" fill="#a78cbf"
                    />

                    <text x="395" y="74" font-size="58">🛎️</text>
                    <text x="625" y="93" font-size="60">🪴</text>
                    <text x="55" y="75" font-size="45">🌅</text>
                `,
                `
                    <rect width="700" height="120" fill="#ffead7"/>

                    <path
                        d="M100 0V30M350 0V30M600 0V30"
                        stroke="#b87543"
                        stroke-width="4"
                    />

                    <g fill="#f3b95b">
                        <path d="M70 45Q100 5 130 45Z"/>
                        <path d="M320 45Q350 5 380 45Z"/>
                        <path d="M570 45Q600 5 630 45Z"/>
                    </g>

                    <rect
                        x="75" y="95"
                        width="550" height="25"
                        rx="8" fill="#d69b70"
                    />

                    <text x="140" y="93" font-size="45">🍲</text>
                    <text x="320" y="93" font-size="45">🍽️</text>
                    <text x="500" y="93" font-size="45">🥣</text>
                `
            ];

            return opening + pictures[sceneNumber] + "</svg>";
        }

        function renderShell() {
            const sceneNumber = activeScene();
            const scene = SCENES[sceneNumber];

            document.documentElement.style.setProperty(
                "--accent",
                scene.color
            );

            document.documentElement.style.setProperty(
                "--pale",
                scene.pale
            );

            document.body.style.background = scene.pale;

            $("scene").innerHTML = sceneArt(sceneNumber);

            $("place").textContent =
                (reviewMode ? "🎫 복습 여행 · " : "") +
                scene.icon + " " + scene.name;

            $("route").innerHTML = SCENES.map(function(item, i) {
                return `
                    <div class="routeItem ${
                        i === sceneNumber ? "current" : ""
                    }">
                        <strong>${item.icon} ${item.ko}</strong>
                        <span>${item.end - item.start}개 단어</span>

                        ${
                            state.stamps[i]
                                ? '<br><span class="stamp">VISITED ✓</span>'
                                : ""
                        }
                    </div>
                `;
            }).join("");

            const stageLabels = [
                "그림 카드",
                "뜻 퀴즈",
                "철자 쓰기",
                "지문 빈칸"
            ];

            $("stages").innerHTML = stageLabels.map(
                function(label, i) {
                    return `
                        <span class="step ${
                            currentStage() === i ? "active" : ""
                        }">
                            ${i + 1}. ${label}
                        </span>
                    `;
                }
            ).join("");

            if (reviewMode) {
                $("stages").innerHTML = `
                    <span class="step active">
                        뜻 + 철자 누적 복습
                    </span>
                `;
            }

            $("saved").textContent = storageOK
                ? "이 기기에 학습 진행을 저장해요."
                : "저장 공간을 사용할 수 없어 현재 창에서만 학습해요.";

            $("reviews").innerHTML = "";

            SCENES.forEach(function(item, i) {
                if (!state.stamps[i]) {
                    return;
                }

                const ready = Date.now() >= Number(state.due[i]);

                const reviewButton = createButton(
                    item.icon + " " + item.ko +
                    (ready ? " · 복습할 시간!" : " · 지금 연습"),
                    function() {
                        startReview(i);
                    }
                );

                $("reviews").append(reviewButton);

                const description = document.createElement("p");
                description.className = "meta";

                description.textContent = ready
                    ? "하루 뒤 복습이 준비됐어요."
                    : "지연 복습: " +
                      new Date(
                          Number(state.due[i])
                      ).toLocaleString("ko-KR");

                $("reviews").append(description);
            });
        }

        // 현재 학습 단계의 문제 목록 준비
        function begin() {
            index = 0;
            attempt = 0;
            resolved = false;

            const sceneNumber = activeScene();

            if (reviewMode) {
                queue = shuffle(
                    cumulativeWords(sceneNumber)
                ).flatMap(function(word) {
                    return [
                        { word: word, kind: 1 },
                        { word: word, kind: 2 }
                    ];
                });
            } else if (currentStage() === 0) {
                queue = sceneWords(sceneNumber);
            } else if (currentStage() === 3) {
                queue = [];
            } else {
                queue = shuffle(cumulativeWords(sceneNumber));
            }

            render();
        }

        function render() {
            renderShell();
            clearFeedback();

            $("content").innerHTML = "";
            $("controls").innerHTML = "";

            if (!reviewMode && state.scene === 3) {
                renderFinishScreen();
                return;
            }

            if (currentStage() === 3) {
                renderCloze();
                return;
            }

            $("counter").textContent =
                `${index + 1} / ${queue.length}`;

            $("bar").style.width =
                (index / queue.length * 100) + "%";

            if (currentStage() === 0) {
                renderFlashcard();
            } else {
                renderQuiz();
            }
        }

        // 1단계: 그림 플래시카드
        function renderFlashcard() {
            const word = queue[index];

            $("content").innerHTML = `
                <h2>여행 가방에 단어를 담아요</h2>

                <p class="meta">
                    그림과 영어를 보고 뜻을 떠올린 뒤 확인하세요.
                </p>

                <div class="flash">
                    <div
                        class="picture"
                        role="img"
                        aria-label="${word.meaning} 그림"
                    >
                        ${word.picture}
                    </div>

                    <div class="word" lang="en">
                        ${word.word}
                    </div>

                    <div id="definition" class="hidden">
                        <div class="meaning">
                            ${word.meaning}
                        </div>

                        <p class="example" lang="en">
                            ${word.example}
                        </p>

                        <p class="translation">
                            ${word.translation}
                        </p>
                    </div>

                    <button
                        id="reveal"
                        type="button"
                        class="outline"
                    >
                        뜻과 예문 보기
                    </button>
                </div>
            `;

            const nextButton = createButton(
                index === queue.length - 1
                    ? "뜻 퀴즈 시작"
                    : "다음 카드",
                function() {
                    index++;

                    if (index === queue.length) {
                        advanceStage();
                    } else {
                        render();
                    }
                },
                true
            );

            nextButton.disabled = true;

            $("reveal").onclick = function() {
                $("definition").classList.remove("hidden");
                $("reveal").classList.add("hidden");
                nextButton.disabled = false;
            };

            if (index > 0) {
                $("controls").append(
                    createButton("이전 카드", function() {
                        index--;
                        render();
                    })
                );
            }

            $("controls").append(nextButton);
        }

        // 2단계: 뜻 선택 / 3단계: 철자 쓰기
        function renderQuiz() {
            const item = queue[index];
            const word = reviewMode ? item.word : item;
            const kind = reviewMode ? item.kind : currentStage();

            resolved = false;
            attempt = 0;

            const earlier =
                word.id < SCENES[activeScene()].start;

            $("content").innerHTML = `
                <h2>
                    ${
                        kind === 1
                            ? "이 단어의 뜻은 무엇일까요?"
                            : "뜻을 보고 영어로 써보세요"
                    }
                </h2>

                <p class="meta">
                    ${
                        earlier
                            ? "🔁 이전 장소에서 배운 단어예요."
                            : "첫 오답에는 힌트, 두 번째 오답에는 정답과 예문이 나와요."
                    }
                </p>

                <div class="flash">
                    <div class="word" ${
                        kind === 1 ? 'lang="en"' : ""
                    }>
                        ${kind === 1 ? word.word : word.meaning}
                    </div>
                </div>
            `;

            if (kind === 1) {
                const distractors = shuffle(
                    WORDS.filter(function(other) {
                        return other.id !== word.id;
                    })
                ).slice(0, 3);

                const options = shuffle([word, ...distractors]);

                const choices = document.createElement("div");
                choices.className = "choices";

                options.forEach(function(option) {
                    const choiceButton = createButton(
                        option.meaning,
                        function() {
                            checkAnswer(
                                option.word === word.word,
                                choiceButton,
                                word,
                                kind
                            );
                        }
                    );

                    choiceButton.className = "choice";
                    choices.append(choiceButton);
                });

                $("content").append(choices);
            } else {
                const form = document.createElement("form");

                form.innerHTML = `
                    <p>
                        <label for="answer">영어 단어</label>
                    </p>

                    <input
                        id="answer"
                        class="entry"
                        placeholder="여기에 영어 단어를 입력하세요"
                        autocomplete="off"
                        autocapitalize="none"
                        spellcheck="false"
                        aria-describedby="feedback"
                    >

                    <div class="controls">
                        <button
                            class="primary"
                            type="submit"
                            id="check"
                        >
                            정답 확인
                        </button>
                    </div>
                `;

                form.onsubmit = function(event) {
                    event.preventDefault();

                    const answer = normalize($("answer").value);

                    if (!answer) {
                        showFeedback("영어 단어를 먼저 입력해주세요.");
                        return;
                    }

                    checkAnswer(
                        answer === word.word,
                        null,
                        word,
                        kind
                    );
                };

                $("content").append(form);
            }

            const nextButton = createButton(
                index === queue.length - 1
                    ? (reviewMode ? "복습 완료" : "다음 학습 단계")
                    : "다음 문제",
                nextQuiz,
                true
            );

            nextButton.id = "next";
            nextButton.disabled = true;

            $("controls").append(nextButton);
        }

        function checkAnswer(correct, selectedButton, word, kind) {
            if (resolved) {
                return;
            }

            if (correct) {
                if (selectedButton) {
                    selectedButton.classList.add("good");
                }

                showFeedback(
                    "정답이에요! " +
                    word.word + " = " + word.meaning +
                    " · " + word.example,
                    true
                );

                resolveQuiz();
                return;
            }

            attempt++;

            if (selectedButton) {
                selectedButton.classList.add("bad");
                selectedButton.disabled = true;
            }

            if (attempt === 1) {
                if (kind === 1) {
                    showFeedback(
                        "힌트: " + word.example +
                        " / " + word.translation
                    );
                } else {
                    showFeedback(
                        "힌트: " + word.word.length +
                        "글자이며, 첫 글자는 " +
                        word.word[0] +
                        "예요. 다시 써보세요."
                    );

                    $("answer").focus();
                    $("answer").select();
                }
            } else {
                showFeedback(
                    "정답: " + word.word +
                    " — " + word.meaning +
                    "\n예문: " + word.example +
                    " (" + word.translation + ")"
                );

                resolveQuiz();
            }
        }

        function resolveQuiz() {
            resolved = true;
            $("next").disabled = false;

            document.querySelectorAll(".choice").forEach(
                function(button) {
                    button.disabled = true;
                }
            );

            if ($("check")) {
                $("check").disabled = true;
                $("answer").disabled = true;
            }

            $("bar").style.width =
                ((index + 1) / queue.length * 100) + "%";
        }

        function nextQuiz() {
            index++;

            if (index < queue.length) {
                render();
                return;
            }

            if (reviewMode) {
                state.due[reviewScene] = Date.now() + DAY;
                save();

                reviewMode = false;
                begin();

                showFeedback(
                    "복습 여행을 마쳤어요! 다음 지연 복습은 하루 뒤예요.",
                    true
                );
            } else {
                advanceStage();
            }
        }

        function advanceStage() {
            state.stage++;
            save();
            begin();
        }

        // 4단계: 여행 지문 빈칸
        function renderCloze() {
            const scene = SCENES[activeScene()];

            const answers = [
                ...scene.story.matchAll(/\{(.*?)\}/g)
            ].map(function(match) {
                return match[1];
            });

            $("counter").textContent =
                answers.length + "개 빈칸";

            $("bar").style.width = "0%";

            $("content").innerHTML = `
                <h2>우리의 여행 이야기를 완성해요</h2>

                <p class="meta">
                    문맥에 맞는 영어 단어를 쓰세요.
                    틀린 빈칸만 고쳐서 다시 확인할 수 있어요.
                </p>

                <p class="meta">${scene.korean}</p>

                <div
                    class="passage"
                    id="passage"
                    lang="en"
                ></div>

                <button
                    class="outline"
                    id="bankToggle"
                    type="button"
                    style="margin-top: 15px"
                >
                    단어 도움말 보기
                </button>

                <div class="bank hidden" id="bank"></div>
            `;

            let blankIndex = 0;

            $("passage").innerHTML = scene.story.replace(
                /\{(.*?)\}/g,
                function() {
                    const currentIndex = blankIndex;
                    blankIndex++;

                    return `
                        <input
                            class="entry"
                            id="blank${currentIndex}"
                            aria-label="${currentIndex + 1}번 빈칸"
                            autocomplete="off"
                            autocapitalize="none"
                            spellcheck="false"
                        >
                    `;
                }
            );

            $("bank").textContent =
                shuffle(answers).join(" · ");

            $("bankToggle").onclick = function() {
                $("bank").classList.toggle("hidden");

                $("bankToggle").textContent =
                    $("bank").classList.contains("hidden")
                        ? "단어 도움말 보기"
                        : "단어 도움말 닫기";
            };

            let tries = 0;

            const checkButton = createButton(
                "빈칸 확인",
                function() {
                    tries++;
                    let correctCount = 0;

                    answers.forEach(function(answer, i) {
                        const input = $("blank" + i);

                        const correct =
                            normalize(input.value) === answer;

                        input.classList.toggle("good", correct);
                        input.classList.toggle("bad", !correct);

                        if (correct) {
                            correctCount++;
                            input.disabled = true;
                        }
                    });

                    $("bar").style.width =
                        (correctCount / answers.length * 100) + "%";

                    if (correctCount === answers.length) {
                        showFeedback(
                            "모든 빈칸을 완성했어요! " +
                            "여권에 스탬프를 찍어볼까요?",
                            true
                        );

                        checkButton.disabled = true;
                        stampButton.disabled = false;
                        return;
                    }

                    let message =
                        `${answers.length}개 중 ${correctCount}개 정답이에요. ` +
                        "테두리가 붉은 빈칸을 다시 살펴보세요.";

                    if (tries >= 2) {
                        const remainingAnswers = answers.map(
                            function(answer, i) {
                                if ($("blank" + i).disabled) {
                                    return null;
                                }

                                return `${i + 1}번: ${answer}`;
                            }
                        ).filter(Boolean);

                        message +=
                            "\n단어 도움말과 정답을 보고 완성해도 좋아요.\n" +
                            remainingAnswers.join(" / ");
                    }

                    showFeedback(message);
                },
                true
            );

            const stampButton = createButton(
                "여권 스탬프 받기",
                completeScene,
                true
            );

            stampButton.disabled = true;

            $("controls").append(checkButton, stampButton);
        }

        // 장소 완료 및 스탬프 애니메이션
        function completeScene() {
            const completedScene = state.scene;

            state.stamps[completedScene] = true;
            state.due[completedScene] = Date.now() + DAY;

            state.scene++;
            state.stage = 0;

            save();

            const overlay = $("overlay");
            overlay.classList.remove("hidden");

            overlay.innerHTML = `
                <div class="modal">
                    <h2 id="modalTitle">
                        ${SCENES[completedScene].ko} 학습 완료!
                    </h2>

                    <div class="bigstamp">
                        ${SCENES[completedScene].icon}
                        <br>
                        WONDER WORLDS
                        <br>
                        VISITED ✓
                    </div>

                    <p>여권에 새로운 스탬프가 찍혔어요.</p>

                    <p class="meta">
                        ${
                            completedScene < 2
                                ? "다음 장소에서는 앞서 배운 단어도 다시 만나요."
                                : "20개 단어를 모두 여행했어요! 하루 뒤 복습도 잊지 마세요."
                        }
                    </p>

                    <button
                        id="continue"
                        type="button"
                        class="primary"
                    >
                        ${
                            completedScene < 2
                                ? SCENES[completedScene + 1].ko + "로 출발"
                                : "나의 여행 마무리"
                        }
                    </button>
                </div>
            `;

            $("continue").onclick = function() {
                overlay.classList.add("hidden");
                begin();
                $("reset").focus();
            };

            $("continue").focus();
        }

        function renderFinishScreen() {
            $("stages").innerHTML = "";
            $("counter").textContent = "20 / 20 단어";
            $("bar").style.width = "100%";

            $("content").innerHTML = `
                <div class="done">
                    <div class="heroicon">🌍 🎉</div>

                    <h2>세상의 단어를 여행했어요!</h2>

                    <p>
                        공항 8개 · 호텔 4개 · 식당 8개
                        <br>
                        뜻, 철자, 문장 속 쓰임을 모두 연습했어요.
                    </p>

                    <p>
                        기억을 더 오래 간직하려면
                        <strong>하루 뒤 Return Trip</strong>으로 돌아오세요.
                    </p>

                    <p class="meta">
                        지금 복습할 수도 있어요.
                        지금 연습은 지연 복습과 달라요.
                    </p>
                </div>
            `;

            $("controls").append(
                createButton(
                    "20개 단어 복습하기",
                    function() {
                        startReview(2);
                    },
                    true
                )
            );
        }

        function startReview(sceneNumber) {
            reviewMode = true;
            reviewScene = sceneNumber;
            begin();
        }

        $("reset").onclick = function() {
            const confirmed = confirm(
                "여권 스탬프와 학습 진행을 지우고 처음부터 시작할까요?"
            );

            if (!confirmed) {
                return;
            }

            state = {
                scene: 0,
                stage: 0,
                stamps: {},
                due: {}
            };

            reviewMode = false;
            save();
            begin();
        };

        // 스탬프 창을 키보드로 사용할 때 초점 유지
        $("overlay").addEventListener("keydown", function(event) {
            if (event.key === "Tab") {
                event.preventDefault();
                $("continue").focus();
            }
        });

        // 앱 시작
        begin();
    </script>
</body>
</html>
